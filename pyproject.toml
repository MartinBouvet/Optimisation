[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimart"
version = "0.2.0"
description = "Semantic context pruning for LLM inference cost reduction"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Martin Bouvet" }]
keywords = ["llm", "rag", "context-pruning", "token-reduction", "onnx"]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.19",
  "tiktoken>=0.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optimart = ["demo/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
