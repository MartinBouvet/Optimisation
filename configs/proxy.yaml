dry_run: true
device: auto
# Use the toy checkpoint from étape 2. Switch after a real MiniLM training run.
checkpoint: artifacts/train_minilm/best.pt
upstream_base_url: https://api.openai.com
timeout_s: 120

prune:
  budget_ratio: 0.45
  max_query_chars: 400
  min_segment_chars: 12
  encoding: cl100k_base
