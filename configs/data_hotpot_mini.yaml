seed: 42
output_dir: data/processed
encoding: cl100k_base
max_query_tokens: 128
max_segment_tokens: 96
min_segment_chars: 12

datasets:
  hotpotqa:
    enabled: true
    hf_id: hotpotqa/hotpot_qa
    config: distractor
    splits: [train, validation]
    max_examples: null
  squad:
    enabled: false
    hf_id: squad
    splits: [train, validation]
    n_distractors: 3
    max_examples: null

labeling:
  alpha: 1.0
  pmi:
    enabled: false
    teacher: gpt2
    device: cpu
    max_length: 1024
  pmi_clip: [-8.0, 8.0]

report:
  write_json: true
